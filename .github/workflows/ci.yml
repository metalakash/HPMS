name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest creates and migrates this database itself; the name must end in _test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hpms_test
      DEBUG: "true"  # the built-in demo accounts the API tests sign in with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (database-backed tests must not be skipped)
        shell: bash  # with pipefail, so a failing pytest fails the step despite the tee
        run: |
          python -m pytest tests -q -W ignore -rs | tee pytest.log  # -m puts the repository root on the path
          ! grep -q "skipped" pytest.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
