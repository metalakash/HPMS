services:
  - type: web
    name: hpms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hpms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hpms-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: USE_LDAP
        value: "false"
      # Demo accounts (admin/admin123 ...) are refused while DEBUG is false unless this is set to "true".
      # Setting it makes the public site accept those published passwords; use it only for a demo with no real data.
      # - key: ALLOW_DEV_AUTH
      #   value: "true"
      - key: DEBUG
        value: "false"

  - type: keyvalue
    name: hpms-redis
    plan: free
    ipAllowList: []

databases:
  - name: hpms-db
    plan: free
    databaseName: sbl_hpms
    user: hpms
