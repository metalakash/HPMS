services:
  - type: web
    name: hpms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health  # API docs are off in production (API_DOCS_ENABLED), so /docs answers 404 and fails the check
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hpms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hpms-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: USE_LDAP
        value: "false"
      # Demo accounts (admin/admin123 ...) are refused while DEBUG is false unless this is "true".
      # ON: this hosted instance is a demo on synthetic data, and the public site accepts those
      # published passwords. Remove it before any real data is loaded here.
      - key: ALLOW_DEV_AUTH
        value: "true"
      # Admin > "Reset demo data" puts the synthetic portfolio back before a presentation. Anyone with
      # the published admin password can use it. Remove together with ALLOW_DEV_AUTH.
      - key: DEMO_RESET_ENABLED
        value: "true"
      # Public site: failed sign-ins lock a username only from the address they came from, so strangers
      # cannot lock the demo accounts. Inside the bank leave the default (user).
      - key: LOGIN_LOCKOUT_SCOPE
        value: "user_ip"
      - key: DEBUG
        value: "false"

  - type: keyvalue
    name: hpms-redis
    plan: free
    ipAllowList: []

databases:
  - name: hpms-db
    plan: free
    databaseName: sbl_hpms
    user: hpms
