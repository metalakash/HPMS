[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl-hpms"
version = "0.1.0"
description = "Siddhartha Bank Hydropower Project Management Solution"
requires-python = ">=3.11"
authors = [{name = "Siddhartha Bank Limited", email = "dev@sbl.com.np"}]
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",  # async engine driver (database.py uses postgresql+asyncpg://)
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.6",
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "ldap3>=2.9.1",
    "email-validator>=2.1.0",
    "strawberry-graphql>=0.220.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "reportlab>=4.0.0",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.1.0",
    "boto3>=1.34.0",
    "aiosmtplib>=3.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.11.0",
    "mypy>=1.7.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages]
find = {where = ["backend"]}

[tool.black]
line-length = 99
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 99
target-version = "py311"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-length handled by Black

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
