version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sbl_hpms_postgres
    environment:
      POSTGRES_USER: hpms
      POSTGRES_PASSWORD: hpms_dev_pass
      POSTGRES_DB: sbl_hpms_dev
    ports:
      - "${HPMS_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  hpms_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sbl_hpms_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hpms:hpms_dev_pass@postgres:5432/sbl_hpms_dev
      DEBUG: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
