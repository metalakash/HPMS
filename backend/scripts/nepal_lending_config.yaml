# ============================================================================
# NEPAL HYDROPOWER LENDING PARAMETERS
# ============================================================================
# Configuration for synthetic loan exposure generation in Phase 8
# Reflects current market conditions for Nepali hydropower project financing
# Last Updated: 2026-09-30

financing:
  eligibility:
    min_capacity_mw: 5
    eligible_project_stages:
      - "construction"
      - "operation"
  penetration_rate: 0.30  # 30% of eligible projects have bank exposure

loan_sizing:
  ltv:
    min: 0.60  # 60% loan-to-value minimum
    max: 0.75  # 75% loan-to-value maximum

  project_cost_per_mw_usd:
    run_of_river: 2.0       # USD 2.0M per MW (low capex)
    storage: 3.5            # USD 3.5M per MW (high capex)
    peaking: 2.2            # USD 2.2M per MW (medium capex)
    default: 2.0

  usd_to_npr_exchange_rate: 131  # Approximate current market rate

  # Project cost contingency (random variation)
  contingency_factor:
    min: 1.10  # +10%
    max: 1.20  # +20%

tenor:
  years_min: 8
  years_max: 15

  grace_period_years:
    min: 2  # Construction period grace
    max: 5

interest_rates:
  annual_percent_min: 9.0   # 9% p.a.
  annual_percent_max: 12.0  # 12% p.a.

operating_metrics:
  plant_factors:
    run_of_river: 0.45      # 45% utilization
    storage: 0.65           # 65% utilization
    peaking: 0.50           # 50% utilization
    default: 0.45

  average_tariff_npr_per_kwh: 5.5  # NPR 5-6/kWh
  tariff_variation:
    min: 0.90  # -10%
    max: 1.05  # +5%

covenants:
  dscr:
    target_min: 1.2   # Debt Service Coverage Ratio minimum
    target_max: 1.5   # Ideal DSCR ceiling
    pass_threshold: 1.25

  ltv:
    pass_threshold: 0.70  # LTV must be ≤70%

  icr:
    target_min: 2.0   # Interest Coverage Ratio minimum
    pass_threshold: 2.0

risk_rating:
  scale: [AAA, AA, A, BBB, BB, B]
  distribution_weights: [0.10, 0.25, 0.35, 0.20, 0.08, 0.02]

ifrs9_classification:
  stages: [Stage 1, Stage 2, Stage 3]
  distribution_weights: [0.85, 0.10, 0.05]  # 85% performing, 10% watch, 5% NPL

facilities:
  types:
    construction_term_loan:
      label: "Construction Term Loan"
      weight: 0.80
    working_capital:
      label: "Working Capital"
      weight: 0.40

  per_project:
    min: 1
    max: 2

# ============================================================================
# EXPLANATION
# ============================================================================
# LTV: Loan-to-Value ratio determines how much the bank finances relative to
#      total project cost. Nepal's market typically 60-75% for hydro.
#
# TENOR: Total loan life. Construction loans typically have 2-5 year grace
#        (no principal repayment), then 8-15 years total.
#
# INTEREST RATE: Nepal's market rates for project loans currently 9-12% p.a.
#
# DSCR: Debt Service Coverage Ratio = Annual Revenue / Annual Debt Service.
#       >1.2 means project revenue covers debt service 1.2x. Covenants
#       typically require DSCR ≥1.2-1.3.
#
# PLANT FACTOR: Percentage of theoretical maximum capacity actually achieved.
#       RoR: ~45% (seasonal, water availability). Storage: ~65% (controlled).
#
# TARIFF: Average power purchase agreement rates. Nepali market: ~NPR 5-6/kWh.
#
# IFRS9: International Financial Reporting Standard 9 loan classifications:
#        Stage 1: Performing (no impairment)
#        Stage 2: Watch list (elevated risk, 30+ days SMA)
#        Stage 3: Non-Performing (default, 90+ days past due)
